[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-soundboard"
version = "0.1.0"
description = "A Linux soundboard with global shortcuts and a mixed virtual microphone"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0", "dbus-next==0.2.3", "imageio-ffmpeg==0.8.1", "yt-dlp[default]==2026.10.26"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
game-soundboard = "game_soundboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
